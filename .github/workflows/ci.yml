name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: docker compose up --build -d
      - run: sleep 3 && HEADER_CHECK_URL=http://127.0.0.1:8080/ npm run check:headers
      - if: always()
        run: docker compose down
      - run: npm run check:performance
      - run: npm run check:links
      - run: npm audit --omit=optional --audit-level=high
